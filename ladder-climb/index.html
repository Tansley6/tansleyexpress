<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ladder Climb | Word-Building Adventure</title>
<style>
:root{--bg:#FBF6EA;--ink:#2E2A26;--card:#FFFDF7;--pri:#1F6F6B;--wood:#B07A45;--wood2:#8A5A2B;--line:#CDBF9F;--hl:#FFF1BF;--soft:#F3EAD6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend","Atkinson Hyperlegible","Andika",Verdana,sans-serif;font-size:19px;line-height:1.5;font-style:normal}
body.spacious{letter-spacing:.12em;word-spacing:.16em}
h1,h2,h3,p{margin:0 0 .5em}
h1{font-size:1.5rem;line-height:1.3}h2{font-size:1.25rem}h3{font-size:1.05rem}
h1:focus{outline:none}
button,input{font:inherit;color:inherit;letter-spacing:inherit;word-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid #1B4F9C;outline-offset:2px}
#app{max-width:1100px;margin:0 auto;padding:12px;min-height:100vh}
.btn{min-height:56px;padding:10px 18px;border-radius:16px;border:2px solid var(--ink);background:var(--card);text-align:left;display:inline-flex;align-items:center;gap:10px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600;justify-content:center}
.btn.sm{min-height:48px;padding:6px 12px}
.btn[disabled]{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--hl);border-width:3px}
.spk{min-width:56px;min-height:56px;justify-content:center;padding:6px;border-radius:50%;flex:none}
body.nospeech .spk{display:none}
body.nospeech .meaning{font-size:1.3rem}
.top{padding:10px 4px 14px}
.bar{display:flex;gap:12px;align-items:flex-start;padding:4px 0 10px;flex-wrap:wrap}
.bar>div{flex:1;min-width:200px}
.col{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.big{flex-direction:column;align-items:center;text-align:center;padding:14px;font-size:1.1rem}
.av{font-size:2.6rem;line-height:1.1;letter-spacing:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.labels{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:.8rem}
.labels span+span{border-left:2px solid var(--line);padding-left:16px}

.lvl{flex-direction:column;align-items:flex-start;width:100%}
.lvl b{font-size:1.2rem}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs .btn{min-width:56px;justify-content:center;font-size:1.6rem;letter-spacing:0;padding:4px}
input.txt{min-height:56px;border:2px solid var(--ink);border-radius:14px;padding:8px 14px;background:#fff;width:100%;max-width:340px}
.foot{margin-top:28px;padding-bottom:20px}
.hold{position:relative;overflow:hidden;width:100%;max-width:520px;touch-action:none;user-select:none;-webkit-user-select:none;font-size:.9rem}
.holdfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hl)}
.holdtxt{position:relative}
/* path */
.path{display:flex;flex-direction:column;gap:12px;max-width:640px}
.pitem{display:flex;gap:8px;align-items:center}
.pitem.z1{margin-left:8%}.pitem.z2{margin-left:16%}
@media(max-width:560px){.pitem.z1{margin-left:4%}.pitem.z2{margin-left:8%}}
.pmain{flex:1;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.pmain .tag{font-size:.8rem}
.locked{border-style:dashed;background:var(--soft)}
/* play */
.play{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:820px){.play{grid-template-columns:minmax(300px,1fr) minmax(320px,1fr);align-items:start}}
.ladwrap{position:relative;max-height:42vh;overflow:auto;padding:4px 4px 4px 0;border-radius:12px}
@media(min-width:820px){.ladwrap{max-height:calc(100vh - 170px)}}
.ladder{display:flex;flex-direction:column-reverse;margin-left:50px;border-left:10px solid var(--wood);border-right:10px solid var(--wood);border-radius:8px;background:var(--card)}
.rung{position:relative;min-height:66px;display:flex;align-items:center;justify-content:center;padding:6px;border-bottom:8px solid var(--wood2)}
.rung.future{opacity:.45}
.rung.current{background:var(--hl)}
.rung.current::before{content:"\25B6";position:absolute;left:-46px;top:50%;transform:translateY(-50%);font-size:1.3rem;letter-spacing:0}
.climber{position:absolute;left:-58px;top:50%;margin-top:-22px;width:44px;height:44px}
.rung.current .climber{display:none}
.word{font-size:1.6rem;font-weight:600;letter-spacing:.14em;display:flex;gap:2px}
.word span{padding:0 2px;border-radius:6px}
.word span.mark{outline:3px dashed var(--pri);outline-offset:1px}
.boxes{display:flex;gap:4px;width:100%;justify-content:center}
.box{flex:1 1 0;min-width:0;max-width:54px;height:54px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-size:1.5rem;font-weight:600;padding:0;letter-spacing:0}
.box.mark{outline:3px dashed var(--pri);outline-offset:2px}
.box.show{background:var(--soft)}
.panel{display:flex;flex-direction:column;gap:12px}
.clue{display:flex;gap:12px;align-items:center}
.emoji{font-size:3.4rem;line-height:1;letter-spacing:0;flex:none}
.cluetxt{flex:1;min-width:0}
.meaning{font-size:1.15rem;font-weight:600;margin:0 0 4px}
.lclue{margin:0}
.msg{min-height:1.6em;margin:0;display:flex;gap:8px;align-items:center;font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:58px;height:58px;border-radius:14px;border:2px solid var(--wood2);background:#FFF4D6;font-size:1.7rem;font-weight:600;letter-spacing:0;padding:0}
.tile[disabled]{opacity:.25;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;justify-content:center;min-width:140px}
.stars{font-size:3rem;letter-spacing:.1em;line-height:1.2}
.center{text-align:center;align-items:center}
.readlad .rung.now{background:var(--hl)}
.readlad .rung.now::before{content:"\25B6";position:absolute;left:-46px;top:50%;transform:translateY(-50%);font-size:1.3rem;letter-spacing:0}
.gap{display:inline-block;min-width:3em;border-bottom:3px solid var(--ink);text-align:center;font-weight:600}
/* grown-up */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.set{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:2px solid var(--soft)}
.set>span{flex:1;min-width:180px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
table{border-collapse:collapse;width:100%}
td,th{border:2px solid var(--line);padding:8px;text-align:left;vertical-align:top;font-weight:400}
th{font-weight:600}
details{border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--card);margin-bottom:10px}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.plist{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.plist .btn{width:100%}
/* worksheet */
.sheet{background:#fff;color:#111;border:2px solid var(--line);border-radius:10px;padding:18px;letter-spacing:.05em}
.sheet .pg+.pg{margin-top:26px;padding-top:20px;border-top:3px dashed #999}
.prow{display:flex;gap:12px;align-items:center;border:2px solid #111;border-top:0;padding:8px}
.prow:first-child{border-top:2px solid #111}
.pclue{flex:1;min-width:0;font-size:.9rem}
.pem{width:52px;height:52px;object-fit:cover;border-radius:8px;filter:grayscale(1);flex:none}
.pboxes{display:flex;gap:3px;flex:none}
.pb{display:inline-flex;width:30px;height:36px;border:2px solid #111;align-items:center;justify-content:center;font-weight:600;letter-spacing:0;font-size:1.1rem}
.wline{display:inline-block;min-width:150px;border-bottom:2px solid #111;height:1.2em}
/* motion */
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.wobble{animation:wob .35s 2}
@keyframes hop{from{transform:translateY(66px)}to{transform:none}}
.hop{animation:hop .6s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
.popin{animation:pop .7s ease-out}
body.noanim *{animation:none!important;transition:none!important}
@media print{
 @page{size:A4;margin:15mm}
 body{background:#fff!important;color:#000;font-size:12pt}
 .noprint{display:none!important}
 #app{padding:0;max-width:none}
 .sheet{border:0;padding:0}
 .sheet .pg+.pg{break-before:page;page-break-before:always;border-top:0;margin-top:0;padding-top:0}
 .prow{break-inside:avoid}
}

.btn.pri{background:linear-gradient(130deg,#2C8177,#23645F);box-shadow:0 3px 0 #174E49}
@media(max-width:560px){.top{min-height:150px;padding:12px 12px 4px}.hero-copy{max-width:68%}.hero-copy h1{font-size:1.65rem}.hero-mascot{width:128px;height:142px;margin-right:-5px}.emoji{width:88px;height:88px;border-radius:18px}.clue{gap:9px}.climber{left:-69px;width:58px;height:58px;margin-top:-29px}.ladder{margin-left:44px}}

function ico(n){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+(ICONS[n]||ICONS.star)+'</svg>'}
function avatarHtml(animal){return '<span class="av" style="--av:'+((AVATAR_COLORS[animal]||AVATAR_COLORS.fox))+'"><img src="'+(ANIMAL_AVATARS[animal]||ANIMAL_AVATARS.fox)+'" alt=""></span>'}
function artHtml(key,alt,cls){const src=ART_IMAGES[key];return src?'<img class="'+(cls||'emoji')+'" src="'+src+'" alt="'+esc(alt||'Picture clue')+'">':''}
function labels(n){const L=LEVELS[n];return '<div class="labels"><span>'+L.us+'</span><span>'+L.sa+'</span><span>'+L.age+'</span></div>'}
function spk(text,label){return '<button class="btn spk" data-act="say" data-text="'+esc(text)+'" aria-label="'+esc(label||"Read this aloud")+'">'+ico("sound")+'</button>'}
function words(L){return [L.start].concat(L.rungs.map(r=>r.answer))}
function byLevel(n){return LADDERS.filter(l=>l.level===n)}
function prof(){return store.profiles.find(p=>p.id===V.pid)||null}
function isLocked(L){return !FULL_VERSION&&byLevel(L.level).indexOf(L)>=3}

function diff(a,b,op){let ai=[],bi=[];if(op==="rearrange"){for(let i=0;i<b.length;i++)bi.push(i)}else if(a.length===b.length){for(let i=0;i<b.length;i++)if(a[i]!==b[i])bi.push(i)}else{const s=a.length<b.length?a:b,l=a.length<b.length?b:a;let p=0;while(p<s.length&&s[p]===l[p])p++;let q=0;while(q<s.length-p&&s[s.length-1-q]===l[l.length-1-q])q++;const idx=[];for(let i=p;i<l.length-q;i++)idx.push(i);if(b.length>a.length)bi=idx;else ai=idx}return{prev:ai,ans:bi}}
function makeTiles(ans,prev,level){const need=ans.split(""),extra=[],n=level===1?2:3;const pool=(prev+"eatsonrildumpcbgh").split("");for(const c of pool){if(extra.length>=n)break;if(need.indexOf(c)<0&&extra.indexOf(c)<0)extra.push(c)}const all=need.concat(extra);for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=all[i];all[i]=all[j];all[j]=t}return all.map(ch=>({ch:ch,used:false}))}

function ladderRows(P){
 const L=P.L,Wd=words(L),r=L.rungs[P.idx];let rows="";
 Wd.forEach((w,i)=>{
  const cur=!P.finished&&i===P.idx+1,done=i<=P.idx;let inner="",cls="future";
  if(done){cls="done"+(i===P.idx?" here":"");const mk=(i===P.idx&&!P.finished&&(P.hint>=1||S.outline))?P.diff.prev:[];
   inner='<div class="word" aria-label="'+w+'">'+w.split("").map((c,j)=>'<span class="'+(mk.indexOf(j)>=0?"mark":"")+'">'+c+'</span>').join("")+'</div>'}
  else if(cur){cls="current";const mark=(P.hint>=1||S.outline)?P.diff.ans:[];
   inner='<div class="boxes" role="group" aria-label="Your word. '+w.length+' letters.">'+P.boxes.map((b,j)=>{const ch=P.reveal?r.answer[j]:(b?b.ch:"");return '<button class="box'+(mark.indexOf(j)>=0?" mark":"")+(P.wob.indexOf(j)>=0?" wobble":"")+(P.reveal?" show":"")+'" data-act="box" data-i="'+j+'" data-fid="b'+j+'" aria-label="Box '+(j+1)+' of '+w.length+', '+(ch?"letter "+ch:"empty")+'">'+ch+'</button>'}).join("")+'</div>'}

/* ================= play logic ================= */
function setupRung(){const P=V.play,r=P.L.rungs[P.idx];if(!r)return;P.prev=P.idx?P.L.rungs[P.idx-1].answer:P.L.start;P.boxes=[];for(let i=0;i<r.answer.length;i++)P.boxes.push(null);P.tiles=makeTiles(r.answer,P.prev,P.L.level);P.hint=0;P.diff=diff(P.prev,r.answer,r.op);P.wob=[];P.reveal=false}
function startPlay(id){const L=LADDERS.find(x=>x.id===id);if(!L||isLocked(L))return;V.play={L:L,idx:0,msg:"",finished:false,hop:false,wob:[]};setupRung();V.view="play";render();autoClue()}
function clueText(){const P=V.play,r=P.L.rungs[P.idx];return r?r.meaning+" "+r.letter:""}
function autoClue(){if(V.view==="play"&&V.play&&!V.play.finished&&V.play.L.level===1)say(clueText())}
function clearBoxes(){const P=V.play;P.boxes=P.boxes.map(()=>null);P.tiles.forEach(t=>t.used=false)}
function placeLetter(ch,k){const P=V.play;if(P.reveal||P.finished)return;const i=P.boxes.indexOf(null);if(i<0)return;if(k==null){k=P.tiles.findIndex(t=>!t.used&&t.ch===ch)}if(k>=0)P.tiles[k].used=true;P.boxes[i]={ch:ch,t:k};P.msg="";render()}
function clearBox(i){const P=V.play;if(P.reveal||P.finished)return;const b=P.boxes[i];if(!b)return;if(b.t>=0)P.tiles[b.t].used=false;P.boxes[i]=null;render()}
function noteHint(n){const p=prof(),P=V.play;if(!p)return;p.hints=p.hints||{};const h=p.hints[P.L.id]=p.hints[P.L.id]||{};h[P.idx]=Math.max(h[P.idx]||0,n);save()}
function quote(arr){return arr.map(c=>"“"+c+"”").join(" and ")}
function doHint(){
 const P=V.play;if(P.finished||P.reveal)return;const r=P.L.rungs[P.idx],d=P.diff;
 if(P.hint<3)P.hint++;noteHint(P.hint);
 if(P.hint===1){P.msg=r.op==="rearrange"?"All the letters move. Use the same letters in a new order.":d.ans.length?"Look for the dotted outline. That is where the new letter goes.":"Look at the word below. Take away the letter with the dotted outline.";render();say(P.msg)}
 else if(P.hint===2){
  const nl=d.ans.map(i=>r.answer[i]),ol=d.prev.map(i=>P.prev[i]);
  P.msg=r.sound?"The new sound is "+r.sound+".":r.op==="rearrange"?"The new word starts with "+quote([r.answer[0]])+".":nl.length?(nl.length>1?"The new letters are ":"The new letter is ")+quote(nl)+".":"Take away "+quote(ol)+".";
  render();say(P.msg.replace(/“(.)”/g,(m,c)=>c.toUpperCase()))}
 else{P.reveal=true;P.msg="Look at the word. Then you build it.";const tok=P.tok=(P.tok||0)+1;render();say(r.answer);setTimeout(()=>{if(V.play!==P||P.tok!==tok||V.view!=="play"||P.finished)return;P.reveal=false;clearBoxes();P.msg="Now you build it.";render()},2600)}
}
function doCheck(){
 const P=V.play;if(P.finished||P.reveal)return;const L=P.L,r=L.rungs[P.idx];
 if(P.boxes.indexOf(null)>=0){P.msg="Fill every box first.";render();return}
 const w=P.boxes.map(b=>b.ch).join("");
 if(w!==r.answer){P.wob=[];for(let i=0;i<w.length;i++)if(w[i]!==r.answer[i])P.wob.push(i);P.msg="Nearly. Have another go.";render();return}
 chime();P.idx++;P.hop=true;P.msg="Yes. You made “"+r.answer+"”.";
 if(P.idx>=L.rungs.length){P.finished=true;render();say(r.answer,()=>setTimeout(()=>{if(V.play===P&&V.view==="play")finish()},700))}
 else{setupRung();render();say(r.answer,()=>{if(V.play===P)autoClue()})}
}
function finish(){const p=prof(),L=V.play.L;if(p){p.done[L.id]=true;save()}V.read={i:-1,playing:false,heard:false};V.view=S.celebrate?"done":"read";render()}
function listen(){
 const R=V.read,Wd=words(V.play.L);if(R.playing)return;R.playing=true;const tok=R.tok=(R.tok||0)+1;
 const step=i=>{if(V.read!==R||R.tok!==tok||V.view!=="read")return;if(i>=Wd.length){R.i=-1;R.playing=false;R.heard=true;render();return}R.i=i;render();say(Wd[i],()=>setTimeout(()=>step(i+1),350))};
 step(0);
}

 gateGo:()=>{const i=$("#gn"),v=(i?i.value:"").trim();if(v===String(V.gate.pick[1])){V.gtab="progress";V.confirm=null;V.view="grown";render()}else{V.gate.msg="That does not match. Have another go.";render()}},

 sheet:d=>{V.sheet=LADDERS.find(l=>l.id===d.id);V.view="sheet";render()},
 backGrown:()=>{V.view="grown";render()},
 doPrint:()=>{try{window.print()}catch(e){}},
 confAsk:d=>{V.confirm=d.c;render()},
 confNo:()=>{V.confirm=null;render()},
 confYes:()=>{const ps=store.profiles,c=ps.find(p=>p.id===V.gchild)||ps[0];if(c){if(V.confirm==="reset"){c.done={};c.hints={};V.resetMsg="Progress cleared for "+c.name+"."}else{store.profiles=ps.filter(p=>p!==c);if(V.pid===c.id)V.pid=null;V.gchild=null;V.resetMsg=""}save()}V.confirm=null;render()}
};
app.addEventListener("click",e=>{const b=e.target.closest?e.target.closest("[data-act]"):null;if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset)});
document.addEventListener("keydown",e=>{
 const t=e.target;
 if(t&&t.tagName==="INPUT"){if(e.key==="Enter"){if(t.id==="gn")ACT.gateGo();if(t.id==="nm")ACT.saveProfile()}return}
 if(V.view!=="play"||!V.play||V.play.finished||e.ctrlKey||e.metaKey||e.altKey)return;

 else if(e.key==="Backspace"){e.preventDefault();const P=V.play;for(let i=P.boxes.length-1;i>=0;i--)if(P.boxes[i]){clearBox(i);break}}
 else if(e.key==="Enter"&&!(t&&t.tagName==="BUTTON")){e.preventDefault();doCheck()}
});
