/* Local vector illustrations: consistent detail on every device. */
.sr-art{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.sr-inline-icon{display:inline-block;width:23px;height:23px;margin-right:7px;vertical-align:-6px;pointer-events:none}
.primary .sr-inline-icon .sr-art{filter:brightness(0) invert(1)}
.icon{padding:7px}.activity .icon{flex-shrink:0}
.avatar{width:62px;height:62px;display:grid;place-items:center;padding:8px;border:1px solid #d9dece;border-radius:20px;background:#eef0e4}
.brand-icon{padding:8px}.brand-icon .sr-art{stroke:#f8edc4}.brand-icon .sr-art path:first-child{fill:#f8edc4}
.hero-art{background:radial-gradient(ellipse at 50% 55%,#edf1df 0 50%,transparent 51%),#e0e8d7}
.owl{display:block;width:156px;height:172px;transform:none;filter:none;z-index:1;padding:8px}
.owl .sr-art{filter:drop-shadow(0 8px 0 #c6d4bc66);stroke-width:1.35}
.float{box-shadow:0 5px 14px #314a3210;z-index:2}
.sticker.earned{padding:5px;background:#fff6d9;border-color:#e4d6aa}
.practice .panel > div[style*="font-size"]:has(>.sr-art){width:88px;height:88px;margin:18px auto!important;padding:9px;background:#ecf0e2;border-radius:24px}
.big-word:has(>.sr-art){width:80px;height:80px;margin:24px auto}

/* Stage 1: family account screens */
.signed-out .header-actions{display:none}
.auth-wrap{max-width:540px;margin:10px auto 30px}
.auth-wrap .panel{padding:30px 28px}
.auth-wrap h1{font-size:clamp(26px,4vw,34px)}
.auth-wrap .primary{width:100%;margin-top:22px;font-size:17px}
.auth-links{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.auth-links button{width:100%}
.linkish{border:0;background:none;box-shadow:none;text-decoration:underline;padding:6px 0;min-height:40px;color:var(--green)}
.linkish:hover{background:none}
.pw-row{display:flex;gap:8px}.pw-row input{flex:1}.pw-row button{white-space:nowrap}
.consent{display:flex;gap:12px;align-items:flex-start;font-weight:normal;font-size:15px;margin-top:18px;line-height:1.6}

.auth-msg{margin:14px 0 0;font-size:15px}.auth-msg:empty{display:none}
.auth-msg.error{background:#fbe9e2;color:#7d3622;padding:12px 14px;border-radius:10px}
.auth-msg.ok{background:#e8f0e2;color:#2c5143;padding:12px 14px;border-radius:10px}
.loading-screen{text-align:center;padding:70px 20px}

/* Calm build: picture picker and Tania's note */
.avatar-pick{border:0;padding:0;margin:18px 0 0}
.avatar-pick legend{font-weight:600;padding:0}
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:2px solid #e3dccb;border-radius:12px;background:#fffdf8;cursor:pointer;font-weight:normal;font-size:14px}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick .avatar{background:none;padding:0;font-size:34px;line-height:1}.pick-art .sr-art{width:44px;height:44px}
.pick:has(input:checked){border-color:#2c5143;background:#e8f0e2}
.pick:has(input:focus-visible){outline:3px solid #2c5143;outline-offset:2px}
.tania-note{background:#fffdf6;border:1px solid #e3dccb;border-radius:14px;padding:20px 22px;margin:0 0 24px}
.tania-note h2{font-size:20px;margin:0 0 10px}
.tania-note p{margin:0 0 12px}
.tania-note .sign{font-weight:600;margin:0}

function validateBackup(d){if(!d||d.version!==1||!Array.isArray(d.children)||!Array.isArray(d.lists)||!Array.isArray(d.sessions)||!d.settings)throw Error('Not a Spell Ready backup.');if(d.children.length>100||d.lists.length>1000)throw Error('This backup is too large.');const ids=new Set();for(const c of d.children){if(typeof c.id!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(c.id)||typeof c.name!=='string'||!c.name.trim()||!animals.includes(c.avatar)||!['Grade R',...Array.from({length:7},(_,i)=>'Grade '+(i+1))].includes(c.grade)||ids.has(c.id))throw Error('A child profile is invalid.');ids.add(c.id);}const lid=new Set();for(const l of d.lists){if(typeof l.id!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(l.id)||lid.has(l.id)||!ids.has(l.child)||typeof l.name!=='string'||!(l.language in languages)||!Array.isArray(l.words)||l.words.length<1||l.words.length>40)throw Error('A list is invalid.');lid.add(l.id);let wids=new Set();for(const w of l.words){if(typeof w.id!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(w.id)||wids.has(w.id)||typeof w.text!=='string'||!w.text.trim()||typeof w.sentence!=='string'||typeof w.chunks!=='string'||!w.progress||!Number.isFinite(w.progress.attempts)||!Number.isFinite(w.progress.first)||!Number.isFinite(w.progress.misses)||!Array.isArray(w.progress.successes)||!w.progress.successes.every(x=>typeof x==='string'))throw Error('A word or progress record is invalid.');wids.add(w.id);}}for(const s of d.sessions){if(typeof s.child!=='string'||typeof s.list!=='string'||typeof s.date!=='string'||typeof s.id!=='string'||!Number.isFinite(s.correct)||!Number.isFinite(s.total))throw Error('A practice record is invalid.');}d.settings={calm:!!d.settings.calm,spacing:[0,1,2].includes(Number(d.settings.spacing))?Number(d.settings.spacing):0,background:['cream','sage','blue','white'].includes(d.settings.background)?d.settings.background:'cream',speed:d.settings.speed==='slow'?'slow':'normal',effects:!!d.settings.effects};return d;}

<div class="list-summary current-list"><div><span class="eyebrow">On your bookshelf</span><br><select class="compact" aria-label="Choose spelling list" onchange="selectList(this.value)">${lists.map(x=>`<option value="${esc(x.id)}" ${x.id===listId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="list-meta"><span class="pill">${l?l.words.length+' words':'No list yet'}</span><span class="sub">${l?esc(l.language):'Add a list in Grown-ups'}${l?.date?' · Test '+esc(l.date):''}</span>${l?.sample?'<span class="sample-label">Removable sample</span>':''}</div></div>
<div class="layout dashboard-layout"><section><div class="section-heading"><div><span class="eyebrow">Find your way to practise</span><h2>What shall we explore?</h2></div><span class="sub">Choose what feels right</span></div><div class="cards activity-grid">${[['learn','👀','Learn It','Look, cover, try and compare'],['hear','🔊','Hear and Spell','Listen closely. Give it a go.'],['missing','🧩','Missing Letters','Find the pieces that belong'],['unscramble','🔀','Unscramble','Bring the letters together'],['chunk','🌿','Chunk It','Small chunks. Bigger confidence.'],['test','📝','Practice Test','A quiet moment to try your words']].map(([id,icon,title,desc],i)=>`<button class="activity activity-${id}" onclick="start('${id}')" ${!l?'disabled':''}><span class="activity-top"><span class="icon" aria-hidden="true">${icon}</span></span><span class="activity-copy"><strong>${title}</strong><small>${id==='chunk'&&!l?.words.some(w=>validChunks(w))?'Add syllable breaks in Grown-ups to explore this activity':desc}</small></span><span class="activity-go" aria-hidden="true">↗</span></button>`).join('')}</div><p class="activity-footnote">A little curiosity is all you need. Hints and second tries are always welcome.</p></section>
<aside class="growth-sidebar"><section class="panel growth-panel"><span class="eyebrow">A space to explore</span><h3 style="margin-top:16px">Your words, your pace</h3><p class="sub">Listening, noticing and trying are all part of learning. You can ask for a hint or take a break whenever you like.</p><button onclick="showProgress(false)">My words <span aria-hidden="true">→</span></button></section><section class="panel weekly-panel"><span class="eyebrow">Little moments to keep</span><h3 style="margin-top:12px">Thank you for exploring</h3><p class="sub">Every kind of practice belongs here.</p><p class="sub">You don’t need to fill a chart or get everything right.</p></section><div class="gentle-note"><span class="note-line"></span><p>No racing. No pressure.<br>There is room to try in your own way.</p></div></aside></div>`;}
let holdTimer;function gate(){if(!window.SR_USER)return;stopSpeech();modal(`<h2>A little space for grown-ups</h2><p>Press and hold for 3 seconds, then answer a simple number question.</p><button class="primary" id="hold">Press and hold to continue</button> <button onclick="closeModal()">Cancel</button><p class="sub">This is a child-friendly gate, not a security lock.</p>`);let b=$('#hold'),start=()=>{if(holdTimer)return;b.textContent='Keep holding…';holdTimer=setTimeout(()=>{holdTimer=null;numberGate();},3000);},stop=()=>{clearTimeout(holdTimer);holdTimer=null;if($('#hold'))$('#hold').textContent='Press and hold to continue';};b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);start();};b.onpointerup=stop;b.onpointercancel=stop;b.onkeydown=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();if(!e.repeat)start();}};b.onkeyup=stop;}
function numberGate(){modal(`<h2>One small check</h2><form onsubmit="event.preventDefault();if(document.getElementById('gate-answer').value.trim().toLowerCase()==='four'){closeModal();adult=true;grownup();}else document.getElementById('gate-note').textContent='Try again: write the number in words.'"><label for="gate-answer">Write 4 as a word</label><input id="gate-answer" autocomplete="off" required><p id="gate-note" role="status"></p><button class="primary">Enter grown-up area</button> <button type="button" onclick="closeModal()">Cancel</button></form>`);$('#gate-answer').focus();}
function requireAdult(){if(!adult){gate();return false;}return true;}
function grownup(){if(!window.SR_USER){authScreen(authMode);return;}if(!requireAdult())return;view='adult';settingsApply();const c=child(),l=list();$('#app').innerHTML=`<div class="topline"><div><span class="eyebrow">Grown-up area</span><h1>Your family’s words</h1><p class="muted">Make a little room for this week’s learning.</p></div><button onclick="home()">✓ Back to child’s practice</button></div><section class="tania-note"><h2>A note from Tania</h2><p>I’m a teacher, and I’m also a mum to a neurodivergent child. I know how quickly a child can decide they are “bad at spelling”, especially when a brother or sister seems to find it easy.</p><p>That is why Spell Ready has no stars to collect, no rewards to win and no scores to compare. There are no bright, busy colours or flashing screens. Each child practises their own words, at their own pace, without being measured against anyone else.</p><p>No child falls behind in Spell Ready, because no one is racing. Every word they practise is a step forward.</p><p>Small steps. Growing confidence.</p><p class="sign">Tania Jacobs, teacher, author and mum</p></section>${!storageOK?'<div class="notice">Saving is unavailable. Export a backup before leaving.</div>':''}<div class="row"><select class="compact" aria-label="Child profile" onchange="selectChild(this.value)">${data.children.map(x=>`<option value="${esc(x.id)}" ${x.id===childId?'selected':''}>${x.avatar} ${esc(x.name)} · ${esc(x.grade)}</option>`).join('')}</select><button onclick="profileForm()">+ Add child</button>${c?'<button onclick="profileForm(true)">Edit child</button><button class="danger" onclick="deleteChild()">Delete child</button>':''}</div><div class="management" style="margin-top:24px"><section class="panel"><div class="topline"><h2>Weekly lists</h2><button class="primary" onclick="listForm()" ${c?'':'disabled'}>+ New list</button></div>${data.lists.filter(x=>x.child===childId).map(x=>`<div class="word-row"><button onclick="selectList('${esc(x.id)}')" ${x.id===listId?'class="primary"':''}>${esc(x.name)}</button><p class="sub">${esc(x.language)} · ${x.words.length} words ${x.date?'· Test '+esc(x.date):''} ${x.sample?'· Removable sample':''} ${x.archived?'· Archived':''}</p><div class="row"><button onclick="listForm('${esc(x.id)}')">Edit</button><button onclick="duplicateList('${esc(x.id)}')">Duplicate</button><button onclick="archiveList('${esc(x.id)}')">${x.archived?'Restore':'Archive'}</button><button class="danger" onclick="deleteList('${esc(x.id)}')">Delete</button></div></div>`).join('')||'<p>No lists yet. Add your family’s weekly school words.</p>'}</section><section><div class="panel"><h2>Comfort settings</h2><h3>The Spell Ready voice</h3><p class="sub">${esc(englishVoiceNote())}</p><button onclick="previewEnglishVoice()">▶ Hear the voice</button><p class="sub">Every family hears the same clear British voice, on any phone, tablet or computer. If you record a word yourself, your recording plays first.</p><label>Letter spacing<select onchange="setSetting('spacing',Number(this.value))">${[0,1,2].map(v=>`<option value="${v}" ${data.settings.spacing===v?'selected':''}>${['Standard','A little wider','Wider'][v]}</option>`).join('')}</select></label><label>Background<select onchange="setSetting('background',this.value)">${['cream','sage','blue','white'].map(v=>`<option ${v===data.settings.background?'selected':''}>${v}</option>`).join('')}</select></label><label>Speech speed<select onchange="setSetting('speed',this.value)"><option value="normal" ${data.settings.speed==='normal'?'selected':''}>Normal</option><option value="slow" ${data.settings.speed==='slow'?'selected':''}>Slow</option></select></label><label><input type="checkbox" style="width:auto" ${data.settings.effects?'checked':''} onchange="setSetting('effects',this.checked)"> Gentle sound effects (off in Calm Mode)</label><p class="sub">Calm Mode keeps spoken words available. Slow speed plays the Spell Ready voice a little slower. Family recordings play as recorded.</p></div><div class="panel"><h2>Family backup</h2><p class="sub">Lists, children and progress save to your family account, so they open on any device you sign in on. Recordings stay on this device only. A backup file includes lists and progress, but not recordings.</p><button onclick="exportBackup()">↓ Export backup</button> <label class="sub">Import a family backup<input type="file" accept="application/json,.json" onchange="importBackup(this.files[0]);this.value=''" aria-label="Import backup"></label></div></section></div>${l?`<section class="panel"><div class="topline"><div><h2>${esc(l.name)}</h2><span class="sub">${esc(l.language)} ${l.sample?'· Removable English sample':''}</span></div><div class="row"><button onclick="showProgress(true)">Progress & tricky words</button><button onclick="printSheet('practice')">Print practice sheet</button><button onclick="printSheet('test')">Print test & answer key</button></div></div><div class="notice">${l.language==='English'?esc(englishVoiceNote()):voiceFor(l)?'A matching browser voice is available. Existing family recordings take priority.':'No matching browser voice is currently available. Visual spelling practice is still available.'}</div><p class="sub">Syllable breaks are optional. Use / between the parts you say, for example sun/shine or hap/py. The parts must make the exact word. Leave the box empty if you are unsure. The original | separator also works. ${l.language==='English'?'English lists use the Spell Ready voice, so no recording is needed. If you record a word, your recording plays first.':'Record the word and, optionally, its sentence in one recording.'}</p>${l.words.map(w=>`<div class="word-row"><div class="row"><strong class="word-title">${esc(w.text)}</strong><span class="pill">${status(w)}</span></div><div class="word-fields"><label>Optional sentence<input value="${esc(w.sentence)}" onchange="updateWord('${w.id}','sentence',this.value)"></label><label>Optional syllable breaks<input id="chunk-input-${w.id}" aria-describedby="chunk-note-${w.id}" value="${esc(w.text.includes('/')?w.chunks:w.chunks.replaceAll('|','/'))}" placeholder="For example sun/shine" oninput="chunkDraftChanged('${w.id}')" onchange="updateWord('${w.id}','chunks',this.value)"><button type="button" class="save-breaks" onclick="saveWordChunks('${w.id}')">Save breaks</button><span class="sub chunk-note" id="chunk-note-${w.id}" role="status">${validChunks(w)?'✓ Saved. Ready for Chunk It.':'Optional: add word parts, then tap Save breaks.'}</span></label></div><div class="row" style="margin-top:12px"><button onclick="speakWordById('${w.id}')">▶ Listen</button>${false?'':`<button id="record-${w.id}" onclick="recordWord('${w.id}')">● Record / replace</button><button onclick="removeRecording('${w.id}')">Delete recording</button><span class="sub" id="record-status-${w.id}">Checking recording…</span>`}</div></div>`).join('')}</section>`:''}`;refreshRecordingLabels();}
function setSetting(k,v){if(!requireAdult())return;data.settings[k]=v;save();settingsApply();}
function profileForm(edit=false){if(!requireAdult())return;const c=edit?child():null;modal(`<h2>${edit?'Edit child':'A new practice pal'}</h2><form id="profile-form"><label>Nickname<input name="name" maxlength="60" value="${esc(c?.name||'')}" required></label><fieldset class="avatar-pick"><legend>Choose a picture</legend><p class="sub">This helps your child find their own name.</p><div class="avatar-grid">${animals.map((a,i)=>`<label class="pick"><input type="radio" name="avatar" value="${a}" ${(c?a===c.avatar:i===0)?'checked':''}><span class="avatar pick-art">${a}</span><span class="pick-name">${({'🦉':'Owl','🦁':'Lion','🐘':'Elephant','🦒':'Giraffe','🐢':'Tortoise','🦋':'Butterfly','🐬':'Dolphin','🐱':'Cat'})[a]||''}</span></label>`).join('')}</div></fieldset><label>School grade<select name="grade">${['Grade R',...Array.from({length:7},(_,i)=>'Grade '+(i+1))].map(a=>`<option ${a===c?.grade?'selected':''}>${a}</option>`).join('')}</select></label><div class="row" style="margin-top:22px"><button class="primary">Save child</button><button type="button" onclick="closeModal()">Cancel</button></div></form>`);$('#profile-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(!name)return;let vals={name,avatar:f.get('avatar'),grade:f.get('grade')};if(c)Object.assign(c,vals);else{let n={id:uid(),...vals};data.children.push(n);childId=n.id;listId=null;}save();closeModal();grownup();};}
function deleteChild(){if(!requireAdult())return;if(!confirm('Delete this child and all their lists, recordings and progress? This cannot be undone.'))return;let ids=data.lists.filter(l=>l.child===childId).flatMap(l=>l.words.map(w=>w.id));ids.forEach(id=>audioStore('delete',id).catch(()=>{}));data.children=data.children.filter(c=>c.id!==childId);data.lists=data.lists.filter(l=>l.child!==childId);data.sessions=data.sessions.filter(s=>s.child!==childId);childId=data.children[0]?.id;listId=data.lists.find(l=>l.child===childId&&!l.archived)?.id;save();grownup();}
function cleanWords(text){return [...new Set(text.split(/[\n,]/).map(s=>s.trim()).filter(Boolean))];}
function listForm(id){if(!requireAdult())return;const l=data.lists.find(x=>x.id===id);draft={id:l?.id,child:childId};modal(`<h2>${l?'Edit weekly list':'Make this week’s list'}</h2><form id="list-form"><label>List name<input name="name" required maxlength="100" value="${esc(l?.name||'')}"></label><div class="form-grid"><label>Language<select name="language">${Object.keys(languages).map(x=>`<option ${x===(l?.language||'English')?'selected':''}>${x}</option>`).join('')}</select></label><label>Optional test date<input type="date" name="date" value="${esc(l?.date||'')}"></label></div><label>School words (1–40)<textarea name="words" required placeholder="One word per line, or separate with commas">${esc(l?.words.map(w=>w.text).join('\n')||'')}</textarea></label><p class="sub">We trim spaces and remove exact duplicates. Capitals, accents and punctuation stay as entered.</p><p id="list-error" role="alert"></p><button class="primary">Review cleaned list →</button> <button type="button" onclick="closeModal()">Cancel</button></form>`);$('#list-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),words=cleanWords(f.get('words'));if(words.length<1||words.length>40){$('#list-error').textContent='Please use between 1 and 40 different words. Your cleaned list has '+words.length+'.';return;}if(!f.get('name').trim())return;Object.assign(draft,{name:f.get('name').trim(),language:f.get('language'),date:f.get('date'),texts:words});reviewDraft();};}
function reviewDraft(){modal(`<h2>Looking good?</h2><p>${esc(draft.name)} · ${esc(draft.language)} · ${draft.texts.length} words</p><p class="sub">Please check every word. These are the exact spellings your child will practise.</p><div class="panel">${draft.texts.map((t,i)=>`<div>${i+1}. ${esc(t)}</div>`).join('')}</div><button class="primary" onclick="saveDraft()">✓ Approve & save list</button> <button onclick="editDraft()">Back to editing</button> <button onclick="closeModal()">Cancel</button>`);}
function editDraft(){const d={...draft};listForm(d.id);let f=$('#list-form');f.elements.name.value=d.name;f.elements.language.value=d.language;f.elements.date.value=d.date;f.elements.words.value=d.texts.join('\n');}
function saveDraft(){if(!requireAdult()||!draft)return;let old=data.lists.find(l=>l.id===draft.id),words=draft.texts.map(t=>old?.words.find(w=>w.text===t)||makeWord(t));if(old){old.words.filter(w=>!words.includes(w)).forEach(w=>audioStore('delete',w.id).catch(()=>{}));Object.assign(old,{name:draft.name,language:draft.language,date:draft.date,words});listId=old.id;}else{let l={id:uid(),child:draft.child,name:draft.name,language:draft.language,date:draft.date,words,archived:false};data.lists.push(l);listId=l.id;}draft=null;save();closeModal();grownup();toast('Your list is ready to practise.');}
async function duplicateList(id){if(!requireAdult())return;let l=data.lists.find(l=>l.id===id),copy={...l,id:uid(),name:l.name+' (copy)',sample:false,archived:false,words:l.words.map(w=>({...makeWord(w.text),sentence:w.sentence,chunks:w.chunks}))};data.lists.push(copy);listId=copy.id;for(let i=0;i<l.words.length;i++){try{let b=await audioStore('get',l.words[i].id);if(b)await audioStore('put',copy.words[i].id,b);}catch(e){toast('List copied. A recording could not be copied.');}}save();grownup();}
function archiveList(id){if(!requireAdult())return;let l=data.lists.find(l=>l.id===id);l.archived=!l.archived;if(l.archived&&id===listId)listId=data.lists.find(x=>x.child===childId&&!x.archived)?.id;else if(!l.archived)listId=id;save();grownup();}
function deleteList(id){if(!requireAdult()||!confirm('Permanently delete this list and its progress and recordings?'))return;let l=data.lists.find(l=>l.id===id);l.words.forEach(w=>audioStore('delete',w.id).catch(()=>{}));data.lists=data.lists.filter(l=>l.id!==id);data.sessions=data.sessions.filter(s=>s.list!==id);if(listId===id)listId=data.lists.find(l=>l.child===childId&&!l.archived)?.id;save();grownup();}
function chunksFor(w){if(!w.chunks)return [];for(const separator of ['|','/']){const parts=w.chunks.split(separator);if(parts.length>1&&parts.every(Boolean)&&parts.join('')===w.text)return parts;}return [];}
function validChunks(w){return chunksFor(w).length>1;}
function normaliseChunks(text,value){if(!value.trim())return '';for(const separator of ['|','/']){const parts=value.split(separator);if(parts.length>1&&parts.every(Boolean)&&parts.join('')===text)return parts.join('|');const trimmed=parts.map(p=>p.trim());if(trimmed.length>1&&trimmed.every(Boolean)&&trimmed.join('')===text)return trimmed.join('|');}return null;}
function chunkDraftChanged(id){const note=$('#chunk-note-'+id);if(note)note.textContent='Not saved yet. Tap Save breaks when ready.';const input=$('#chunk-input-'+id);input?.removeAttribute('aria-invalid');}
function saveWordChunks(id){const input=$('#chunk-input-'+id);if(input)updateWord(id,'chunks',input.value);}
function updateWord(id,key,value){if(!requireAdult())return;const w=list()?.words.find(w=>w.id===id);if(!w)return false;if(key==='chunks'){const clean=normaliseChunks(w.text,value),input=$('#chunk-input-'+id),note=$('#chunk-note-'+id);if(clean===null){const message='The parts need to make '+w.text+' exactly. Use / between parts and keep every letter. Your entry is still here to edit.';if(input)input.setAttribute('aria-invalid','true');if(note)note.textContent=message;else toast(message);return false;}value=clean;input?.removeAttribute('aria-invalid');w[key]=value;save();if(note)note.textContent=storageOK?(value?'✓ Saved. This word is ready for Chunk It.':'Breaks cleared. This word still works in the other activities.'):'Ready for this visit, but device saving is unavailable. Export a backup before leaving.';return true;}w[key]=value;save();return true;}
function chunkSetupHelp(){modal(`<h2>Explore words in parts</h2><p>Chunk It uses word parts saved by a grown-up. This list doesn’t have any saved word parts yet.</p><p>In Grown-ups, add breaks such as <strong>sun/shine</strong> in the Optional syllable breaks box, then tap <strong>Save breaks</strong>. The parts must make the exact word.</p><p>You can choose another activity while those parts are being set up.</p><button class="primary" onclick="closeModal();gate()">Grown-up setup</button> <button onclick="closeModal()">Back to activities</button>`);}
const britishFemaleNames=['Google UK English Female','Microsoft Sonia','Microsoft Libby','Microsoft Maisie','Microsoft Hazel','Microsoft Susan','Serena','Kate','Martha','Stephanie','Fiona','Moira','Tessa','Karen','Female'];
function femaleVoiceRank(name){return britishFemaleNames.findIndex(known=>new RegExp('(?:^|\\b)'+known+'(?:$|\\b)','i').test(name));}
let voices=[],britishVoiceChoice=null;try{localStorage.removeItem('spell-ready-british-voice');}catch(e){}
try{const saved=JSON.parse(localStorage.getItem('spell-ready-british-voice')||'null');if(saved&&typeof saved.uri==='string'&&typeof saved.name==='string')britishVoiceChoice=saved;else if(saved)localStorage.removeItem('spell-ready-british-voice');}catch(e){}
function voiceLang(v){return String(v.lang||'').toLowerCase().replace('_','-');}
function englishVoiceScore(v){const lang=voiceLang(v),r=femaleVoiceRank(v.name),fem=r>=0?0:1;if(lang==='en-gb')return fem*20+(r>=0?r:0);if(lang==='en-za')return 40+fem;if(['en-ie','en-au','en-nz'].includes(lang))return 50+fem;if(lang.startsWith('en'))return 60+fem;return 999;}
function availableBritishFemaleVoices(){if(!voices.length&&window.speechSynthesis)voices=speechSynthesis.getVoices()||[];return voices.filter(v=>englishVoiceScore(v)<999).sort((a,b)=>englishVoiceScore(a)-englishVoiceScore(b)||(a.localService===b.localService?0:a.localService?-1:1)||a.name.localeCompare(b.name)||String(a.voiceURI).localeCompare(String(b.voiceURI)));}
function britishVoice(){
 const available=availableBritishFemaleVoices();
 if(false&&britishVoiceChoice){const saved=available.find(v=>(v.voiceURI||'')===britishVoiceChoice.uri&&v.name===britishVoiceChoice.name)||available.find(v=>v.name===britishVoiceChoice.name);if(saved)return saved;}
 return available[0]||null;
}
function voiceFor(l){if(l.language==='English')return britishVoice();const lang=languages[l.language];if(!lang)return null;const matching=voices.filter(v=>v.lang.toLowerCase().split(/[-_]/)[0]===lang);return matching.find(v=>v.lang.toLowerCase().replace('_','-')===lang+'-za')||matching[0]||null;}
function englishVoiceNote(){return 'English words and instructions are read by the Spell Ready voice, a clear British female voice.';}
function refreshVoices(){voices=window.speechSynthesis?.getVoices()||[];if(view==='adult'&&!recording&&!$('#modal').open)grownup();const note=$('#audio-note');if(note&&list()?.language==='English')note.textContent=englishVoiceNote();}
if(window.speechSynthesis){voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=refreshVoices;let tries=0;const poll=setInterval(()=>{const v=speechSynthesis.getVoices();if(v.length&&v.length!==voices.length)refreshVoices();if(v.length||++tries>20)clearInterval(poll);},250);}
let activeAudio=null,speechNonce=0;function stopSpeech(){speechNonce++;window.speechSynthesis?.cancel();try{srPlayer?.pause();}catch(e){}if(activeAudio){activeAudio.pause();URL.revokeObjectURL(activeAudio.src);activeAudio=null;}}
let currentUtterance=null;
function speakWithVoice(text,v,previewRate,fallbackLang){if(!window.speechSynthesis){toast('This browser cannot read words aloud. Try Chrome, Edge or Safari.');return;}const wasBusy=speechSynthesis.speaking||speechSynthesis.pending;stopSpeech();const nonce=speechNonce;const go=(useVoice)=>{if(nonce!==speechNonce)return;try{const u=new SpeechSynthesisUtterance(text);if(useVoice&&v){u.voice=v;u.lang=v.lang;}else u.lang=fallbackLang||'en-GB';u.rate=previewRate??(data.settings.speed==='slow'?.65:.9);u.pitch=1;u.onerror=e=>{if(['canceled','interrupted'].includes(e.error))return;if(useVoice&&v){go(false);return;}toast('Audio could not play. Please try Listen again.');};currentUtterance=u;speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){if(useVoice&&v)return go(false);toast('Audio could not play. Please try Listen again.');}};setTimeout(()=>go(true),wasBusy?120:30);}
const SR_VOICE_URL='https://spell-ready-voice-1039296335506.africa-south1.run.app/speak';
const srClips=new Map();let srPlayer=null,srUnlocked=false,srFallbackNoted=false;
const SR_SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
function srGetPlayer(){if(!srPlayer){srPlayer=new Audio();srPlayer.preload='auto';}return srPlayer;}
/* Phones only allow sound after a tap, so the player is woken up on the first tap. */
function srUnlock(){if(srUnlocked)return;srUnlocked=true;try{const p=srGetPlayer();p.src=SR_SILENT;const r=p.play();if(r&&r.catch)r.catch(()=>{srUnlocked=false;});}catch(e){srUnlocked=false;}}
document.addEventListener('pointerdown',srUnlock,{capture:true});document.addEventListener('keydown',srUnlock,{capture:true});
function srTimeout(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);}
function srFetchClip(text){if(srClips.has(text))return srClips.get(text);const p=(async()=>{if(!window.SR_FB?.token)throw new Error('not ready');const tok=await SR_FB.token();const r=await fetch(SR_VOICE_URL,{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw new Error('voice '+r.status);const b=await r.blob();if(!b.size)throw new Error('empty clip');return URL.createObjectURL(b);})();srClips.set(text,p);p.catch(()=>srClips.delete(text));return p;}
async function speakEnglish(text){stopSpeech();const nonce=speechNonce;text=String(text||'').replace(/\s+/g,' ').trim();if(!text)return;try{const url=await srTimeout(srFetchClip(text),9000);if(nonce!==speechNonce)return;const p=srGetPlayer();const rate=data.settings.speed==='slow'?.8:1;p.src=url;p.defaultPlaybackRate=rate;p.playbackRate=rate;p.preservesPitch=true;p.webkitPreservesPitch=true;await p.play();}catch(e){if(nonce!==speechNonce)return;console.warn('Spell Ready voice back-up used',e);if(!srFallbackNoted){srFallbackNoted=true;toast('The Spell Ready voice could not load, so your device voice is reading for now.');}speakWithVoice(text,britishVoice());}}
function speakText(text){speakEnglish(text);}
function previewEnglishVoice(){speakText('Hello. Let’s listen, say the word, and practise spelling together.');}
function voiceChooserMarkup(){const available=availableBritishFemaleVoices(),selected=britishVoice();return `<section class="voice-chooser"><label for="british-voice-option">Choose the reading voice<select id="british-voice-option" ${available.length?'':'disabled'}>${available.length?available.map((v,i)=>`<option value="${i}" ${v===selected?'selected':''}>${esc(v.name)}</option>`).join(''):'<option>Device standard voice</option>'}</select></label><p class="sub">Preview “because” on its own and in a sentence. Previews do not change your saved voice.</p><div class="row"><button onclick="previewVoiceOption(.9)" ${available.length?'':'disabled'}>▶ Normal preview</button><button onclick="previewVoiceOption(.65)" ${available.length?'':'disabled'}>▶ Slower preview</button><button class="primary" onclick="saveVoiceOption()" ${available.length?'':'disabled'}>Use this voice</button></div><p class="sub">${available.length>1?'British voices are listed first. Choose the one you find clearest. It stays the same until you choose another.':'Your browser currently offers '+(available.length?'one English voice.':'only its standard voice.')+' Words will still be read aloud.'}</p><details><summary>Android Chrome: finding more voices</summary><p class="sub">On your phone, search Settings for “Text-to-speech output”. Open the speech engine’s settings and look for English (United Kingdom) voice data or voice options. Names and menus vary by phone. Reopen Chrome and refresh Spell Ready after changing these settings. Chrome may still expose only one suitable voice. Microsoft Sonia and Apple Serena are not normally supplied by Android Chrome.</p></details></section>`;}
function chosenVoiceOption(){const el=$('#british-voice-option');if(!el||el.disabled)return null;const index=Number(el.value);if(!Number.isInteger(index)||index<0)return null;return availableBritishFemaleVoices()[index]||null;}
function previewVoiceOption(rate){if(!requireAdult())return;const voice=chosenVoiceOption();if(!voice)return toast('That voice is no longer available. Refresh the page and try again.');speakWithVoice('Because. I practise because I enjoy exploring. Because.',voice,rate===.65?.65:.9);}

function audioDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('No recording storage'));let req=indexedDB.open('spell-ready-audio',1);req.onupgradeneeded=()=>req.result.createObjectStore('recordings');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('Recording storage is blocked'));});return dbPromise;}

async function recordWord(id){if(!requireAdult())return;if(recording){if(recording.id===id){recording.recorder.stop();}else toast('Stop the current recording first.');return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('Recording is unavailable in this browser. Try a recent Safari, Chrome or Edge browser.');let stream;try{await audioDB();stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[],recorder=new MediaRecorder(stream);recording={id,recorder,stream};let b=$('#record-'+id);b.textContent='■ Stop & save';$('#record-status-'+id).textContent='Recording… say the word and optional sentence.';recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onerror=()=>{stream.getTracks().forEach(t=>t.stop());recording=null;toast('Recording failed. Please try again.');grownup();};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());recording=null;try{let blob=new Blob(chunks,{type:recorder.mimeType});if(!blob.size)throw Error('Empty recording');await audioStore('put',id,blob);toast('Family recording saved on this device.');}catch(e){toast('The recording could not be saved. Check browser storage and try again.');}if(view==='adult')grownup();};recorder.start();}catch(e){stream?.getTracks().forEach(t=>t.stop());toast('Microphone or recording storage is unavailable. Check browser permissions, or read together.');}}

function weightedWords(words,count){let pool=[...words],out=[];while(pool.length&&out.length<count){let weights=pool.map(w=>status(w)==='↻ Tricky'?5:status(w)==='✓ Confident'?1:3),r=Math.random()*weights.reduce((a,b)=>a+b,0),i=0;while(i<weights.length-1&&r>=weights[i])r-=weights[i++];out.push(pool.splice(i,1)[0]);}return out;}
const modeNames={learn:'Learn It',hear:'Hear and Spell',missing:'Missing Letters',unscramble:'Unscramble',chunk:'Chunk It',test:'Practice Test',today:'Today’s Practice'};
function start(mode,ids){let l=list();if(!l||l.archived)return toast('Choose an active list first.');adult=false;let words=ids?l.words.filter(w=>ids.includes(w.id)):l.words;if(mode==='chunk'){words=words.filter(validChunks);if(!words.length){chunkSetupHelp();return;}}if(!words.length)return;let tasks;if(mode==='test')tasks=shuffle(words).map(w=>({id:w.id,mode:'test',test:true}));else if(mode==='today'){let chosen=weightedWords(words,Math.min(3,words.length));tasks=chosen.map((w,i)=>({id:w.id,mode:['learn','missing','hear'][i%3],test:false}));tasks.push(...shuffle(chosen).map(w=>({id:w.id,mode:'test',test:true})));}else tasks=weightedWords(words,Math.min(5,words.length)).map(w=>({id:w.id,mode,test:false}));session={id:uid(),mode,tasks,index:0,answers:[],hinted:false};view='practice';prepareTask();}
function currentWord(){return list().words.find(w=>w.id===session.tasks[session.index].id);}function currentTask(){return session.tasks[session.index];}

function renderTask(){const w=currentWord(),t=currentTask(),show=t.mode==='learn'&&!session.covered,inst=instruction(t);$('#app').innerHTML=`<div class="practice"><div class="topline"><button onclick="leavePractice()">← Take a break</button><span class="pill">${modeNames[session.mode]} · At your pace</span></div><div class="panel"><div class="eyebrow">${t.test?'A gentle check':modeNames[t.mode]}</div><h2 style="margin:16px 0 12px">${t.test?'One word at a time.':t.mode==='learn'?'Look. Cover. Give it a go.':'You’ve got time to try.'}</h2><p>${inst} <button aria-label="Read instruction" onclick="readInstruction()">🔊</button></p>${show?`<div class="big-word">${esc(w.text)}</div>${w.sentence?`<p>${esc(w.sentence)}</p>`:''}<button onclick="speakWord(currentWord())">▶ Hear the word</button> <button class="primary" onclick="session.covered=true;renderTask();">Cover the word →</button>`:`${t.mode==='missing'?`<div class="big-word">${Array.from(w.text).map((c,i)=>session.missing.includes(i)?'＿':esc(c)).join('')}</div>`:t.mode==='chunk'?'<div class="big-word">🌿</div>':'<div style="font-size:40px;margin:18px" aria-hidden="true">'+(t.test?'📝':'👂')+'</div>'}<div class="row" style="justify-content:center"><button onclick="speakWord(currentWord(),currentTask().test)">▶ Hear ${t.test?'word, sentence, word':'the word'}</button><button onclick="lookTogether()">${t.test?'Look together (with help)':'Hint / look together'}</button></div><p class="sub" id="audio-note">${lAudioNote()}</p>${t.mode==='missing'?`<label for="answer">Missing letters only</label><input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(session.answer)}" oninput="session.answer=this.value">`:`<label for="answer">Your spelling</label><input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(session.answer)}" oninput="session.answer=this.value">`}<div class="tiles">${session.pool.map((p,i)=>`<button class="tile" aria-la function commitSession(complete){let s=session,l=list();if(s.committed)return;s.committed=true;let byWord=new Map();for(let r of s.answers){let a=byWord.get(r.word)||[];a.push(r);byWord.set(r.word,a);}for(let [id,answers]of byWord){let w=l.words.find(w=>w.id===id),p=w.progress;p.attempts++;if(answers[0].first)p.first++;if(answers.some(a=>!a.correct)){p.misses++;p.tricky=true;}else if(answers.every(a=>a.first)){p.tricky=false;}if(answers.every(a=>a.first)&&!p.successes.includes(s.id))p.successes.push(s.id);p.last=new Date().toISOString();}let now=new Date().toISOString();if(s.answers.length)data.sessions.push({id:s.id,child:childId,list:listId,date:now,correct:s.answers.filter(r=>r.first).length,total:s.answers.length,complete});save();}

 if(c==='auth/email-already-in-use')return 'There is already an account with this email. Please sign in instead.';
 if(c==='auth/invalid-email')return 'Please check the email address. It doesn’t look quite right.';
 if(c==='auth/weak-password')return 'Please choose a longer password, at least 8 characters.';
 if(c==='auth/too-many-requests')return 'Too many tries for now. Please wait a few minutes, then try again.';
 if(c==='auth/network-request-failed')return 'We couldn’t connect. Please check your internet connection and try again.';
 return 'Something went wrong. Please try again in a moment.';}
async function authSubmit(e){e.preventDefault();const go=$('#auth-go'),email=($('#auth-email')?.value||'').trim(),pw=$('#auth-pw')?.value||'',m=authMode;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return authMsg('Please type your email address, for example name@example.com.');
 if(m!=='forgot'&&!pw)return authMsg('Please type your password.');
 if(m==='create'&&pw.length<8)return authMsg('Please choose a password with at least 8 characters.');
 if(m==='create'&&!$('#auth-consent').checked)return authMsg('Please tick the box to confirm you are the parent, guardian or teacher.');
 const label=go.textContent;go.disabled=true;go.textContent='One moment…';authMsg('','ok');
 try{if(m==='create')await SR_FB.signUp(email,pw);else if(m==='forgot'){await SR_FB.reset(email);authMsg('If there is an account for '+email+', a reset link is on its way. Please check your inbox, and your spam folder too.','ok');}else await SR_FB.signIn(email,pw);}
 catch(err){if(m==='forgot'&&err?.code==='auth/user-not-found')authMsg('If there is an account for '+email+', a reset link is on its way. Please check your inbox, and your spam folder too.','ok');else authMsg(authError(err));}
 finally{if($('#auth-go')===go){go.disabled=false;go.textContent=label;}}}

  try{localStorage.setItem('spell-ready-owner',u.uid);localStorage.setItem('spell-ready-v1',JSON.stringify(data));}catch(e){}

async function cloudFlush(){clearTimeout(cloudTimer);cloudTimer=null;

 if(!window.SR_USER||!cloudReady||!cloudPending)return;
 const json=JSON.stringify(data);if(json.length>=790000){cloudPending=false;cloudState='error';toast('This family’s data is too large to save online. Please archive or delete some old lists.');return;}
 cloudPending=false;cloudState='saving';const p=SR_FB.save(window.SR_USER.uid,json,window.SR_USER.email||'');cloudSaving=p;

 finally{if(cloudSaving===p)cloudSaving=null;}}

 try{await SR_FB.signOut();}catch(e){window.SR_USER=null;authScreen('signin');}}
window.addEventListener('beforeunload',e=>{if(cloudPending||cloudSaving){cloudFlush();e.preventDefault();e.returnValue='';}});
